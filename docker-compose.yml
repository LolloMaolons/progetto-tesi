services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api-rest:
    build: ./api-rest
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "8080:8080"

  gateway-graphql:
    build: ./gateway-graphql
    environment:
      REST_BASE_URL: http://api-rest:8080
    depends_on:
      - api-rest
    ports:
      - "4000:4000"

  ws-events:
    build: ./ws-events
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "7070:7070"

  mcp-server-catalog:
    build: ./mcp-server-catalog
    stdin_open: true
    tty: true
    environment:
      REST_BASE_URL: http://api-rest:8080
    depends_on:
      - api-rest
      - redis

  mcp-server-orders:
    build: ./mcp-server-orders
    stdin_open: true
    tty: true
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  mcp-host:
    build: ./mcp-host
    stdin_open: true
    tty: true
    environment:
      REST_BASE_URL: http://api-rest:8080
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - mcp-server-catalog
      - mcp-server-orders
      - redis